<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Acara 30</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; color: #172033; }
    .student-photo { width: 48px; height: 48px; object-fit: cover; border-radius: 50%; }
    #status.error { color: #b91c1c; }
  </style>
</head>
<body>
  <main class="container py-4">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1>Dashboard Mahasiswa</h1>
        <p>Login sebagai <strong id="role-label"></strong> · Total: <strong id="total">0</strong></p>
      </div>
      <button id="logout" class="btn btn-outline-secondary" type="button">Logout</button>
    </header>
    <div id="notification" class="alert" role="alert" aria-live="assertive" hidden></div>
    <div id="loading-indicator" class="d-flex align-items-center gap-2 mb-3" role="status" hidden>
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      <span>Memuat data...</span>
    </div>
    <p id="status" role="status" aria-live="polite">Memuat data...</p>
    <section id="management" class="card shadow-sm mb-4" hidden>
      <div class="card-body">
      <h2 class="h4">Kelola mahasiswa (admin)</h2>
      <form id="mahasiswa-form" class="row g-3" novalidate>
        <div class="col-md-3">
          <label class="form-label" for="nim">NIM</label>
          <input id="nim" class="form-control" name="nim" inputmode="numeric" pattern="[0-9]{9}" minlength="9" maxlength="9" placeholder="9 digit" required>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="nama">Nama</label>
          <input id="nama" class="form-control" name="nama" maxlength="100" required>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="prodi">Program studi</label>
          <input id="prodi" class="form-control" name="prodi" maxlength="50" required>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="foto">Foto (JPG/PNG, maks. 2MB)</label>
          <input id="foto" class="form-control" name="foto" type="file" accept="image/jpeg,image/png">
        </div>
        <div class="col-12 d-flex gap-2">
          <button id="save-button" class="btn btn-primary" type="submit">Tambah</button>
          <button id="cancel-edit" class="btn btn-outline-secondary" type="button" hidden>Batal</button>
        </div>
      </form>
      </div>
    </section>
    <div class="table-responsive card shadow-sm">
    <table class="table table-striped table-hover align-middle mb-0">
      <thead>
        <tr><th>Foto</th><th>NIM</th><th>Nama</th><th>Program Studi</th><th id="actions-heading" hidden>Aksi</th></tr>
      </thead>
      <tbody id="mahasiswa-list"></tbody>
    </table>
    </div>
  </main>
  <script src="api.js" defer></script>
  <script src="dashboard.js" defer></script>
</body>
</html>
